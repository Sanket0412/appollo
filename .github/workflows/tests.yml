name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests (offline, fixture based, no secrets)
        run: python -m pytest -q
        env:
          # settings.py requires DATABASE_URL to exist; no test connects to it.
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused

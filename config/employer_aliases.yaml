# Manual overrides for employer_match.py. Keys and values are normalized with normalize_company()
# at load time, so exact spelling/punctuation here does not matter.
#
# A key maps to one or more LCA employer names. When a company files LCAs under several legal
# entities (common for large tech companies), list all of them here; their filing counts are
# summed. Seed this file as multi-entity cases turn up in lca_loader.py's top-20 output or in
# fuzzy-match misses during later steps.

Amazon:
  - Amazon.com Services LLC
  - Amazon Web Services, Inc.
  - Amazon Development Center U.S., Inc.

# Found via Step 5's live run: companies.yaml's display name didn't fuzzy-match the LCA legal
# entity closely enough (missing "Associates"/"Global Markets" entirely drops below the 90 threshold).
Walmart:
  - Wal-Mart Associates, Inc.

Citigroup:
  - Citibank, N.A.
  - Citigroup Global Markets Inc.

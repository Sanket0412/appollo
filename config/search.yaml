windows:            # --window value -> hours
  24h: 24
  7d: 168
  14d: 336
grace_hours: 2      # added to every fetch window; dedup removes overlap
max_posting_age_days: 14   # hard cap: a job must have a known posted date within this many days, any window

titles:
  include:          # case-insensitive regexes; at least one must match
    - '\bdata scien(ce|tist)'
    - '\bmachine learning\b'
    - '\bml\s*(engineer|scientist|ops|platform|infrastructure)\b'
    - '\bmlops\b'
    - '\b(ai|a\.i\.)\s*(/\s*ml\s*)?(engineer|scientist|developer)\b'
    - '\bapplied (ai|ml|scientist|science)\b'
    - '\b(gen(erative)?\s*ai|llm|nlp)\b'
    - '\bdeep learning\b'
    - '\bresearch (engineer|scientist)\b.*\b(ml|ai|machine learning)\b'
    - '\bdecision scien'
  exclude:          # none may match
    - '\bintern(ship)?\b'
    - '\bco-?op\b'
    - '\bstaff\b'
    - '\bprincipal\b'
    - '\bdistinguished\b'
    - '\bdirector\b'
    - '\bhead of\b'
    - '\bvp\b|\bvice president\b'
    - '\bmanager\b'
    - '\bpostdoc'
    - '\bprofessor\b'
    - '\bsales\b'

locations:
  us_states: [AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
  us_keywords: ['united states', 'usa', 'u.s.', 'us-remote', 'remote - us', 'remote, us', 'remote (us)', 'anywhere in the us']
  non_us_keywords: ['canada', 'toronto', 'vancouver', 'united kingdom', 'london', 'ireland', 'dublin', 'india', 'bangalore', 'bengaluru', 'hyderabad', 'germany', 'berlin', 'france', 'paris', 'netherlands', 'amsterdam', 'poland', 'spain', 'singapore', 'australia', 'mexico', 'brazil', 'israel', 'emea', 'apac', 'latam']
  remote_keywords: ['remote', 'anywhere', 'distributed']
  nyc_metro:        # substring match, case-insensitive
    - 'new york'
    - 'nyc'
    - 'manhattan'
    - 'brooklyn'
    - 'queens'
    - 'bronx'
    - 'staten island'
    - 'long island city'
    - 'jersey city'
    - 'hoboken'
    - 'newark'
    - 'weehawken'
    - 'secaucus'
    - 'harrison, nj'
    - 'fort lee'
    - 'edison'
    - 'princeton'
    - 'iselin'
    - 'white plains'
    - 'stamford'
    - 'greenwich'
  unclear_remote_policy: skip   # no location, or no clear US signal (including remote with no country): skip. Decided 2026-10-01.

red_flags:          # hard exclude when found in the description, case-insensitive
  - 'must be (a )?u\.?s\.? citizen'
  - 'u\.?s\.? citizen(ship)? (is )?required'
  - 'citizenship is required'
  - '(active|current|ability to obtain)\s+(a\s+)?(secret|top secret|ts/sci|public trust)'
  - 'security clearance (is )?required'
  - '(will|can|do) not (provide |offer )?sponsor'
  - 'unable to (provide |offer )?sponsor'
  - 'not (able|eligible) to sponsor'
  - 'no (visa |h-?1b )?sponsorship'
  - 'sponsorship (is )?not (available|provided|offered)'
  - 'without (the need for )?(current or future )?(visa )?sponsorship'
  - '(green card|gc) holders? only'
  - '\busc(/gc)? only\b'

staffing:
  company_blocklist:   # compared against normalize_company(); extend as needed
    - robert half
    - teksystems
    - insight global
    - randstad
    - adecco
    - kforce
    - apex systems
    - aerotek
    - kelly services
    - manpowergroup
    - motion recruitment
    - jobot
    - cybercoders
    - harnham
    - hays
    - beacon hill staffing
    - vaco
    - akkodis
    - modis
    - collabera
    - mindlance
    - diverse lynx
    - dice
  description_patterns:
    - 'on behalf of (our|a) client'
    - 'our client (is|has)'
    - '\bw-?2 (only|contract)\b'
    - '\bc2c\b|corp[- ]to[- ]corp'
    - '\bstaffing (agency|firm|partner)\b'

geo:
  # Straight-line (great-circle) distance, not driving distance. City coordinates are offline (geonamescache).
  hubs:
    nyc: {lat: 40.7128, lon: -74.0060}
    dc: {lat: 38.9072, lon: -77.0369}
    philadelphia: {lat: 39.9526, lon: -75.1652}
  score_hubs: [nyc, dc]        # location score uses the nearer of these (decided 2026-10-01: nearest hub)
  full_points_miles: 25        # 10 points at or inside this distance
  zero_points_miles: 250       # 0 points at or beyond this distance; linear in between
  nyc_metro_miles: 50          # digest group "NYC metro": within this many miles of NYC
  corridor_hubs: [dc, philadelphia]
  corridor_miles: 50           # digest group "DC / Philadelphia corridor": within this of D.C. or Philadelphia

lca:
  relevant_soc: ['15-2051', '15-1221', '15-1252']   # Data Scientists, Computer and Information Research Scientists, Software Developers
  fuzzy_threshold: 90

workday_search_terms: ['data scientist', 'machine learning', 'AI engineer', 'applied scientist']

jobspy:
  # Exact python-jobspy Site enum values (verified against the installed 1.1.82). If glassdoor or
  # zip_recruiter error out or return nothing on a given run, log a warning and continue.
  sites: [indeed, linkedin, google, glassdoor, zip_recruiter]
  search_terms: ['data scientist', 'machine learning engineer', 'AI engineer', 'applied scientist']
  results_wanted: 40
  distance_miles: 50

scoring:
  model: claude-haiku-4-5-20251001
  location_max_points: 10       # location part of core fit, computed in code from geo.* (Haiku no longer scores location)
  recency_max_points: 15        # shown in the digest: full points when posted just now, 0 at max_posting_age_days. Not part of core fit.
  min_similarity: 0.50          # chosen at Step 7 (2026-10-01); raise once irrelevant titles appear in larger runs
  max_per_run: 60
  max_yoe_required: 5           # exclude when years_required_min > this, i.e. skip 6+ (candidate has about 4 years)
  batch_wait_minutes: 25
  fallback_sync: true

ranking:
  # Decided 2026-10-01: the digest is ordered by how recently a job was posted, newest first, within
  # NYC metro / Remote US / Elsewhere US. Within the same posting day, higher core fit comes first.
  # rank_score = days since 2026-01-01 of posted_at + core_fit / tiebreak_divisor.
  # The old bonus weights (NYC, remote, sponsorship, LCA, freshness) are retired.
  tiebreak_divisor: 1000

digest:
  max_jobs: 30
  min_core_fit: 50              # core fit = skills_match + experience_fit + domain_fit + location_fit (max 85); recency excluded
